<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kalendarz opon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="12" cy="12" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v6M12 15.5v6M2.5 12h6M15.5 12h6" stroke="currentColor" stroke-width="1.6"/></svg>
      <span>Kalendarz opon</span>
    </div>
    <div class="topcenter">
      <nav class="tabs" aria-label="Widok">
        <button data-tab="day">Dziś</button>
        <button data-tab="week">Tydzień</button>
        <button data-tab="month">Miesiąc</button>
      </nav>
      <div class="search">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Szukaj: rejestracja, nazwisko, telefon" autocomplete="off">
        <div id="search-results" class="search-results" hidden></div>
      </div>
    </div>
    <div class="tools">
      <button id="btn-zoom" class="icon-btn zoom-btn" title="Powiększ / zmniejsz napisy">A+</button>
      <button id="btn-export" class="icon-btn" title="Pobierz kopię wszystkich wizyt do Excela">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Kopia do Excela</span>
      </button>
    </div>
  </header>

  <main id="app"></main>

  <footer class="foot no-print">
    <button id="btn-stats" class="foot-btn" title="Statystyki (wymaga hasła)" aria-label="Statystyki">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span class="foot-text">Statystyki</span>
    </button>
  </footer>

  <button id="fab" class="fab" title="Dodaj wizytę" aria-label="Dodaj wizytę">
    <svg viewBox="0 0 24 24" width="36" height="36" aria-hidden="true"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg>
    <span class="fab-text">Nowa wizyta</span>
  </button>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true"></div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
